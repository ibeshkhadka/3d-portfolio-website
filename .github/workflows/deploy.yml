name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Install outer deps
        run: npm install --prefix apps/outer

      - name: Install inner deps
        run: npm ci --prefix apps/inner

      - name: Build outer (3D room)
        run: CI=false npm run build --prefix apps/outer
        env:
          PUBLIC_URL: /3d-portfolio-website

      - name: Build inner (2D OS)
        run: CI=false npm run build --prefix apps/inner
        env:
          PUBLIC_URL: /3d-portfolio-website/os

      - name: Prepare docs folder
        run: |
          mkdir -p docs
          cp -r apps/outer/public/* docs/
          mkdir -p docs/os
          cp -r apps/inner/build/* docs/os/
          touch docs/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4